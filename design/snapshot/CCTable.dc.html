<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/credential-connections-design-system-081ce699-1423-4ee3-8e65-465674c518bc/colors_and_type.css">
<link rel="stylesheet" href="ds/credential-connections/tokens.css">
<link rel="stylesheet" href="ds/credential-connections/components/bundle.css">
<style>
  .cc-tbl thead th { position: sticky; top: 0; z-index: 2; background: var(--gray-50); border-top: 1px solid var(--border-primary, var(--gray-200)); }
  .cc-tbl-flush thead th { border-top: 0; }
  .cc-tbl { scroll-padding-top:var(--space-12); }
  /* The scroll area can take keyboard focus (to scroll with arrow keys). Show the design system focus edge instead of the browser's default ring (which follows the computer's accent color, e.g. orange). */
  .cc-tbl:focus { outline: none; }
  .cc-tbl:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--blue-600); }
  .cc-tbl tbody td { vertical-align: middle; }
  .cc-tbl tbody tr { height: 64px; }
  .cc-tbl tbody td { border-bottom: 1px solid var(--gray-200); }
  .cc-tbl .cc-trunc { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cc-tbl .cc-sel { display: none; }
  .cc-tbl-select .cc-sel { display: table-cell; }
</style>
</helmet>
<div class="cc-tbl {{ selectClass }} {{ flushClass }}" style="flex: 1 1 auto; min-height: 0; overflow: auto;">
  <table style="width: 100%; border-collapse: separate; border-spacing: 0; min-width: {{ minWidth }};">
    {{ children }}
  </table>
  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
    <div style="padding:var(--space-12) var(--space-6); text-align: center;">
      <sc-if value="{{ plainIcon }}" hint-placeholder-val="{{ true }}">
        <i data-lucide="{{ emptyIcon }}" style="width: 32px; height: 32px; color: var(--gray-400);"></i>
      </sc-if>
      <sc-if value="{{ featured }}" hint-placeholder-val="{{ false }}">
        <span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; box-sizing: border-box; border: 1px solid var(--gray-200); border-radius:var(--radius-lg); background:var(--bg-primary); box-shadow: var(--shadow-xs); color: var(--gray-700);"><i data-lucide="{{ emptyIcon }}" style="width: 24px; height: 24px;"></i></span>
      </sc-if>
      <div style="font: var(--fw-semibold) {{ titleSize }} var(--font-body); color: var(--gray-900); margin-top: {{ titleGap }};">{{ emptyTitle }}</div>
      <sc-if value="{{ hasEmptyText }}" hint-placeholder-val="{{ false }}">
        <div style="font: var(--fw-regular) {{ textSize }} var(--font-body); color: {{ textFg }}; margin: {{ textMargin }}; max-width: 360px;">{{ emptyText }}</div>
      </sc-if>
      <sc-if value="{{ hasAction }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top:var(--space-6);"><button type="button" class="cc-btn cc-btn--secondary" onClick="{{ onAction }}">{{ actionLabel }}</button></div>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
    <div style="padding:var(--space-12) var(--space-6); text-align: center; font: var(--fw-medium) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--gray-500);">Loading…</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:420},&quot;minWidth&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;720px&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Sizing&quot;},&quot;selectable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;flushTop&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sizing&quot;},&quot;empty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;States&quot;},&quot;loading&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;States&quot;},&quot;emptyIcon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;search-x&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;States&quot;},&quot;emptyTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;No results found&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;States&quot;},&quot;emptyText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;States&quot;},&quot;featuredIcon&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;States&quot;},&quot;actionLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;States&quot;},&quot;onAction&quot;:{&quot;editor&quot;:null}}">
class Component extends DCLogic {
  componentDidMount() { if (window.lucide) window.lucide.createIcons(); }
  componentDidUpdate() { if (window.lucide) window.lucide.createIcons(); }
  renderVals() {
    const p = this.props;
    return {
      minWidth: p.minWidth ?? '720px',
      selectClass: p.selectable ? 'cc-tbl-select' : '',
      flushClass: p.flushTop ? 'cc-tbl-flush' : '',
      empty: !!p.empty && !p.loading,
      loading: !!p.loading,
      emptyIcon: p.emptyIcon ?? 'search-x',
      emptyTitle: p.emptyTitle ?? 'No results found',
      emptyText: p.emptyText ?? '',
      hasEmptyText: !!p.emptyText,
      featured: !!p.featuredIcon, plainIcon: !p.featuredIcon,
      titleSize: p.featuredIcon ? 'var(--text-md-size)/var(--text-md-lh)' : 'var(--text-smed-size)/var(--text-smed-lh)', titleGap: p.featuredIcon ? '16px' : '12px',
      textFg: p.featuredIcon ? 'var(--gray-600)' : 'var(--gray-500)', textMargin: p.featuredIcon ? '4px auto 0' : '2px auto 0',
      textSize: p.featuredIcon ? 'var(--text-sm-size)/var(--text-sm-lh)' : 'var(--text-xs-size)/var(--text-xs-lh)',
      hasAction: !!p.actionLabel && typeof p.onAction === 'function',
      actionLabel: p.actionLabel || '', onAction: p.onAction || (() => {}),
    };
  }
}
</script>
</body>
</html>
